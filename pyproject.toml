[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-evidence-pipeline"
version = "0.1.0"
description = "A股年度报告的采集、版本选择、PDF校验与章节定位工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kai" }]
keywords = ["financial-disclosure", "annual-report", "document-pipeline", "cninfo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pypdf>=4.2",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
disclosure-pipeline = "disclosure_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/ykkai-w/Disclosure-Evidence-Pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
